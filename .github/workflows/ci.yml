name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Dummy values: build only needs env to pass validation (lib/config/env.ts).
      APP_NAME: cypher-web-ci
      NEXTAUTH_SECRET: ci-dummy-nextauth-secret-0123456789
      NEXTAUTH_URL: http://localhost:3000
      ACCESS_TOKEN_SECRET: ci-dummy-access-secret-0123456789
      REFRESH_TOKEN_SECRET: ci-dummy-refresh-secret-0123456789
      PRIMARY_DB_URI: mongodb://127.0.0.1:27017/ci
      BOT_DB_URI: mongodb://127.0.0.1:27017/ci-bot
      BOT_DB_NAME: ci-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
